<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./styles/styles.css" />
		<title>OfertLab</title>
	</head>

	<body>
		<header>
			<nav class="nav-menu">
				<button
					type="button"
					class="hamburger-button"
					id="hamburger-button"
					aria-label="Abrir menu principal"
					aria-controls="menu"
					aria-expanded="false"
				>
					<span class="icon"></span>
				</button>

				<ul class="menu menu-closed" id="menu" aria-hidden="true">
					<li><a href="#">Mercado Livre</a></li>
					<li><a href="#">Amazon</a></li>
					<li><a href="#">Shein</a></li>
					<li><a class="last-button" href="#">Shopee</a></li>
				</ul>
				<div class="nav-menu__icon">
					<a href="#"
						><img
							class="icon-ofertlab"
							src="./assets/img/Logo-full.png"
							alt="OfertLab"
					/></a>
				</div>
			</nav>
		</header>

		<main>
			<section class="header-hero">
				<h2 class="header-hero__title">
					DESCOBERTAS INCRÍVEIS QUE
					<span class="title-blue">VOCÊ VAI AMAR!</span>
				</h2>
				<p class="header-hero__text">
					Explore nossos melhores produtos e ofertas
					irresistíveis de afiliados, selecionados para seu estilo de vida.
				</p>

				<a class="button-offert" href="#">VER OFERTAS!</a>
			</section>
		</main>

		<footer></footer>

		<script src="./js/menu.js" defer></script>
	</body>
</html>
